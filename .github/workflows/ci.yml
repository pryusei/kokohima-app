# PR と main への push：型チェック・lint・単体テスト・本番のビルド（docs/specs/T-30-ci-review.md「2. ci」）
# main 以外のブランチへの push だけでは回さない（PR を作れば回る）
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じ PR に新しい push が来たら、古い実行を取り消す。main への push はコミットごとに別のグループにし、取り消さない
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR の変更を分類する（scripts/ci/changes.mjs）。文書（docs/ と .md）だけなら unit を飛ばす。
  # 比べる先は PR の宛先ではなく既定のブランチ。チェックの結果はコミットに付くので、宛先で結果が変わると、
  # 同じコミットで宛先を main 以外にした PR を作るだけで、必須チェックを飛ばせてしまう
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE: origin/${{ github.event.repository.default_branch }}
        run: node scripts/ci/changes.mjs "$BASE"

  unit:
    needs: changes
    # changes が成功して文書だけのときだけ飛ばす。changes が失敗したとき・main への push（changes がない）では回す。
    # paths-ignore で飛ばすと、必須チェックが「待機中」のまま止まってマージできなくなるので、ジョブの if: で飛ばす
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          # ランナーに入っている古い 22.x を使わず、セキュリティ修正の入った最新の 22.x を取る
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # 本番のビルド。画面のビルド・wrangler の設定・API のビルドに E2E 用の経路と Apple のボタンが含まれていないことを確かめる
      # （apps/api/scripts/check-*.mjs。deploy:prod も同じ検査を通してからデプロイする。docs/specs/T-12-release.md）
      - run: pnpm --filter api build:prod

  # 実装PRに単体テストの追加・変更が含まれているかを確認する。ブランチ名ではなく差分で判定する（scripts/ci/changes.mjs）。
  # changes に頼らず自分で差分を取る（changes が失敗したときに、この検査が飛ばされないように）
  require-unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 単体テストの追加を確認
        env:
          BASE: origin/${{ github.event.repository.default_branch }}
        run: node scripts/ci/changes.mjs "$BASE" --require-unit-tests
