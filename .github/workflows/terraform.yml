# infra/ を変更したPR：フォーマット・検証・plan（applyは人が手動で行う）
name: terraform
on:
  pull_request:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    # 秘密を使う前に人の承認を挟む。承認者は GitHub の Settings → Environments → terraform-plan の Required reviewers で設定する（issue #59）
    environment: terraform-plan
    strategy:
      matrix:
        env: [staging, prod]
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PLAN }}   # 読み取り中心の権限に絞る
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_R2_SECRET_ACCESS_KEY }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}          # kokohima.app のゾーン（prod の DNS の記録で使う）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - run: terraform fmt -check -recursive ../../
      - run: terraform init -backend-config="endpoints={s3=\"https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: terraform validate
      - run: terraform plan -no-color -lock=false
