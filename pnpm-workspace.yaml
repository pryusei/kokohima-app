packages:
  - apps/*
  - packages/*

# インストール時のスクリプト実行を許可するパッケージ（ネイティブバイナリの取得に必要）
onlyBuiltDependencies:
  - esbuild
  - workerd

# 開発用ツールの中に固定された古い版の脆弱性を、同じメジャーのパッチ版で直す
# （本番の Worker には入らない。親のパッケージが更新されたら消す）
overrides:
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  "sharp@>=0.35.0 <0.35.5": "^0.35.5"
  "zod@>=4.0.0 <4.6.6": "^4.6.7"
