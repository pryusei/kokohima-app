# pushごと：型チェック・lint・単体テスト
name: ci
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          # ランナーに入っている古い 22.x を使わず、セキュリティ修正の入った最新の 22.x を取る
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # 本番のビルド。画面のビルド・wrangler の設定・API のビルドに E2E 用の経路と Apple のボタンが含まれていないことを確かめる
      # （apps/api/scripts/check-*.mjs。deploy:prod も同じ検査を通してからデプロイする。docs/specs/T-12-release.md）
      - run: pnpm --filter api build:prod

  # 実装PR（feat/*）に単体テストの追加・変更が含まれているかを確認する
  require-unit-tests:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: 単体テストの追加を確認
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if ! echo "$changed" | grep -Eq '^(apps|packages)/.+\.test\.tsx?$'; then
            echo "::error::実装PRには単体テスト（*.test.ts）の追加・変更が必要です"
            exit 1
          fi
